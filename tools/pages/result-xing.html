g fill="#2f2a33"><path d="M70 94 C66 64 86 54 104 56 C122 58 134 70 130 92 C120 80 102 76 86 72 C80 80 75 86 70 94 Z"/></g><circle cx="88" cy="95" r="3.2" fill="#2b2f3a"/><circle cx="112" cy="95" r="3.2" fill="#2b2f3a"/><path d="M93 106 Q101 111 108 105" stroke="#2b2f3a" stroke-width="2.6" stroke-linecap="round" fill="none"/><g fill="none" stroke="#2b2f3a" stroke-width="2.5"><circle cx="88" cy="95" r="9"/><circle cx="112" cy="95" r="9"/><path d="M97 95 H103"/></g><path d="M108 91 L115 98" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g></g></g></svg></div>    <p class="label">你 的 精 神 状 态 人 设 是</p>    <h1>人间清醒</h1>    <p class="slogan">“看得太明白，但我说得很委婉。”</p>    <div class="tags"><span>理智在线</span><span>不跟风</span><span>看得太明白</span></div>  </div>  <p class="desc">你是朋友堆里的理智担当：大家上头的时候你在算概率，大家 emo 的时候你在摆事实。不站队、不跟风、不信饼，人间的事你门儿清——只是大多数时候，懒得说破。</p>  <p class="banger">本命口头禅：“说实话，这事吧——”</p>  <p class="foot">测一测你是哪种「精神状态」人设 · 32 题速鉴 · @ 朋友来战</p></div></body></html>
